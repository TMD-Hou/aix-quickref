<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0C6B70">
<meta name="robots" content="noindex,nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="AIX手冊">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<title>AIX 隨身手冊</title>
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}

/* Layout: phone-first; drawer picks a section (現場急救 / 指令 / …); one clean list per section, actions only inside an opened row */
:root{
  --bg:#EEF2F4; --surface:#FFFFFF; --fg:#13222C; --muted:#5B6B75; --line:#D6DEE3;
  --accent:#0C6B70; --accent-soft:#D7ECEC; --on-accent:#FFFFFF; --term:#0E1B23; --term-fg:#E4F0EF;
  --sos:#B45309; --sos-soft:#FDF0E1; --warn-bg:#FFF4DE; --warn-fg:#8A5300; --danger:#B42318; --danger-bg:#FDE8E6; --mark:#FFE58F; --ph:#B45309;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft JhengHei","PingFang TC","Noto Sans TC",sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0B1419; --surface:#13212A; --fg:#E3ECEF; --muted:#93A5AE; --line:#24363F;
  --accent:#5CC9C2; --accent-soft:#163A3C; --on-accent:#062221; --term:#060D12; --term-fg:#E4F0EF;
  --sos:#F2A65A; --sos-soft:#3A2A16; --warn-bg:#3A2A0E; --warn-fg:#F5C46B; --danger:#FF8A80; --danger-bg:#3B1D1B; --mark:#7A5D00; --ph:#F2A65A; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0B1419; --surface:#13212A; --fg:#E3ECEF; --muted:#93A5AE; --line:#24363F;
  --accent:#5CC9C2; --accent-soft:#163A3C; --on-accent:#062221; --term:#060D12; --term-fg:#E4F0EF;
  --sos:#F2A65A; --sos-soft:#3A2A16; --warn-bg:#3A2A0E; --warn-fg:#F5C46B; --danger:#FF8A80; --danger-bg:#3B1D1B; --mark:#7A5D00; --ph:#F2A65A; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{--fs:15px}
body{background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:var(--fs);line-height:1.5;-webkit-text-size-adjust:100%;margin:0}
button{font-family:var(--sans);color:inherit}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:760px;margin:0 auto;padding-inline:16px;padding-block:0 40px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);margin-inline:-16px;padding:10px 16px 8px;border-bottom:1px solid var(--line)}
.top{display:flex;align-items:center;gap:10px}
.hb{flex:0 0 auto;width:42px;height:42px;border-radius:11px;border:1px solid var(--line);background:var(--surface);color:var(--accent);font-size:22px;line-height:1;cursor:pointer}
h1{font-size:19px;margin:0;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.count{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.search{position:relative;margin-top:8px}
.search input{width:100%;font-size:16px;padding:11px 40px 11px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);color:var(--fg);font-family:var(--sans)}
.search input::-webkit-search-cancel-button{display:none}
.search input:focus{outline:none;border-color:var(--accent)}
.search button{position:absolute;right:6px;top:50%;transform:translateY(-50%);border:0;background:transparent;color:var(--muted);font-size:20px;width:34px;height:34px;border-radius:8px;cursor:pointer}
.rail{display:flex;gap:6px;overflow-x:auto;margin-top:8px;padding-bottom:2px;scrollbar-width:none}
.rail::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;border:1px solid var(--line);background:var(--surface);color:var(--muted);border-radius:999px;padding:5px 12px;font-size:13px;cursor:pointer;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--on-accent);border-color:var(--accent);font-weight:700}
.rail.sub .chip{font-size:12px;padding:3px 10px}
.rail.sub .chip[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent);border-color:var(--accent)}
.lead{color:var(--muted);font-size:13px;margin:12px 2px 0}
.hd{font-size:12px;color:var(--muted);font-weight:700;margin:16px 2px 6px;letter-spacing:.04em}
.list{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.list:empty{display:none}
.r{padding:10px 12px;border-bottom:1px solid var(--line);cursor:pointer}
.r:last-child{border-bottom:0}
.r code{display:block;font-family:var(--mono);font-size:.95em;font-weight:700;word-break:break-word;white-space:pre-wrap}
.r .u{font-size:.86em;color:var(--muted);margin-top:2px}
.r.open{background:var(--bg);cursor:default}
.r.open .u{color:var(--fg)}
.gh{padding:7px 12px;font-size:11.5px;font-weight:700;color:var(--accent);background:var(--accent-soft);border-bottom:1px solid var(--line)}
.more{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.bx{background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:7px 10px;font-size:.88em;min-width:0}
.bx b{display:block;font-size:11px;color:var(--accent);margin-bottom:2px}
.bx code{font-weight:400;font-size:.95em}
.bx.dg{background:var(--danger-bg);border-color:transparent;color:var(--danger)}
.bx.dg b{color:var(--danger)}
.meta{font-size:11.5px;color:var(--muted)}
.acts{display:flex;gap:8px}
.btn{flex:1;border:1.5px solid var(--accent);background:transparent;color:var(--accent);font-weight:700;font-size:14px;border-radius:10px;padding:8px;cursor:pointer}
.btn.pri{background:var(--accent);color:var(--on-accent)}
.btn.ok{background:var(--accent-soft);color:var(--accent)}
em.ph{font-style:normal;color:var(--ph);font-weight:700}
mark{background:var(--mark);color:inherit;border-radius:3px;padding:0 1px}
.empty{text-align:center;color:var(--muted);padding:36px 12px;background:var(--surface)}
/* 現場急救 */
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:12px}
.card{border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:12px;text-align:left;cursor:pointer;min-width:0}
.card .e{font-size:22px;line-height:1}
.card .t{display:block;font-size:15px;font-weight:800;margin-top:6px}
.card .d{display:block;font-size:12px;color:var(--muted);margin-top:2px}
.flows{display:flex;flex-direction:column}
.fl{display:flex;align-items:center;gap:10px;width:100%;border:0;border-bottom:1px solid var(--line);background:var(--surface);padding:11px 12px;text-align:left;cursor:pointer;font-size:14.5px}
.fl:last-child{border-bottom:0}
.fl span{margin-left:auto;font-size:12px;color:var(--muted)}
.back{border:0;background:transparent;color:var(--accent);font-size:14px;font-weight:700;padding:12px 2px 0;cursor:pointer}
.sosh{margin:6px 2px 0}
.sosh h2{margin:0;font-size:20px}
.sosh p{margin:4px 0 0;color:var(--muted);font-size:13px}
.steps{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.stp{display:grid;grid-template-columns:28px minmax(0,1fr);gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.stp .n{width:26px;height:26px;border-radius:50%;background:var(--accent);color:var(--on-accent);font-size:13px;font-weight:800;display:grid;place-items:center}
.stp .x{font-size:.9em}
.stp code{display:block;font-family:var(--mono);font-size:.88em;background:var(--term);color:var(--term-fg);padding:6px 9px;border-radius:7px;white-space:pre-wrap;word-break:break-word;margin-top:5px}
.stp code em.ph{color:#F2A65A}
.stp .w{margin-top:5px;font-size:.85em;color:var(--danger);font-weight:700}
.stp .cp{margin-top:6px;border:1px solid var(--accent);background:transparent;color:var(--accent);font-size:12px;font-weight:700;border-radius:8px;padding:3px 10px;cursor:pointer}
.stp .cp.ok{background:var(--accent);color:var(--on-accent)}
.menu{background:var(--surface);border-bottom:1px solid var(--line);padding:10px 12px}
.menu:last-child{border-bottom:0}
.menu .p{font-family:var(--mono);font-size:.87em;word-break:break-word}
.pill{display:inline-block;background:var(--accent-soft);color:var(--accent);border-radius:6px;padding:0 7px;font-weight:700;font-size:11px}
footer{margin-top:24px;font-size:12px;color:var(--muted);text-align:center}
/* 選單 */
.ov{position:fixed;inset:0;background:rgba(5,15,20,.5);z-index:20;opacity:0;pointer-events:none;transition:opacity .2s}
.dr{position:fixed;top:0;bottom:0;left:0;width:min(82vw,320px);background:var(--surface);z-index:21;transform:translateX(-102%);transition:transform .22s ease;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);box-shadow:4px 0 24px rgba(0,0,0,.25)}
body.menu-open .ov{opacity:1;pointer-events:auto}
body.menu-open .dr{transform:none}
body.menu-open{overflow:hidden}
.dh{display:flex;justify-content:space-between;align-items:center;padding:16px 16px 8px}
.dh h2{margin:0;font-size:18px}
.dx{border:0;background:transparent;color:var(--muted);font-size:26px;line-height:1;cursor:pointer;width:36px;height:36px}
.dbody{overflow-y:auto;flex:1;padding:4px 10px 16px}
.big{display:flex;align-items:center;gap:12px;width:100%;border:0;background:transparent;border-radius:12px;padding:11px 10px;margin-bottom:4px;font-size:16px;font-weight:700;cursor:pointer;text-align:left}
.big i{font-style:normal;width:32px;height:32px;border-radius:9px;background:var(--bg);display:grid;place-items:center;font-size:17px;flex:0 0 auto}
.big b{margin-left:auto;font-size:12px;color:var(--muted);font-weight:600;font-variant-numeric:tabular-nums}
.big[aria-current="true"]{background:var(--accent-soft);color:var(--accent)}
.big.sos{color:var(--sos)}
.big.sos[aria-current="true"]{background:var(--sos-soft)}
.big:disabled{opacity:.45;cursor:default}
.pl{display:flex;align-items:center;width:100%;border:0;background:transparent;border-radius:10px;padding:8px 10px 8px 54px;font-size:14.5px;cursor:pointer;text-align:left;color:var(--fg)}
.pl b{margin-left:auto;font-size:12px;color:var(--muted);font-weight:600;font-variant-numeric:tabular-nums}
.pl[aria-current="true"]{background:var(--accent-soft);color:var(--accent);font-weight:700}
.pf{display:inline-block;font-family:var(--sans);font-size:10.5px;font-weight:700;padding:0 6px;border-radius:5px;background:var(--accent-soft);color:var(--accent);margin-left:6px;vertical-align:2px;white-space:nowrap}
.dhr{border:0;border-top:1px solid var(--line);margin:10px 4px}
.small{display:flex;align-items:center;gap:10px;width:100%;border:0;background:transparent;padding:9px 10px;font-size:14px;color:var(--muted);cursor:pointer;text-align:left;border-radius:10px}
.small[aria-current="true"]{color:var(--accent);font-weight:700;background:var(--accent-soft)}
.fsz{display:flex;align-items:center;gap:6px;padding:8px 10px;font-size:14px;color:var(--muted)}
.fsz span{flex:1}
.fsz button{border:1px solid var(--line);background:var(--surface);color:var(--accent);font-weight:700;border-radius:8px;padding:3px 10px;cursor:pointer}
.fsz output{min-width:2.5em;text-align:center;font-size:13px}
.vline{padding:8px 10px;font-size:12px;color:var(--muted)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}


#lock{min-height:100vh;display:flex;align-items:center;justify-content:center;padding-inline:16px;padding-block:24px}
.lk{width:100%;max-width:360px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:24px 20px;display:flex;flex-direction:column;gap:12px}
.lk .logo{width:56px;height:56px;border-radius:14px;background:var(--term);color:var(--prompt);font-family:var(--mono);font-weight:700;display:grid;place-items:center;font-size:18px}
.lk h2{margin:0;font-size:20px}.lk p{margin:0;color:var(--muted);font-size:14px}
.lk input[type=password]{width:100%;font-size:16px;padding:12px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg);color:var(--fg)}
.lk input[type=password]:focus{outline:none;border-color:var(--accent)}
.lk label{display:flex;gap:8px;align-items:center;font-size:14px;color:var(--muted)}
.lk button{border:0;background:var(--accent);color:var(--surface);font-size:16px;font-weight:700;padding:12px;border-radius:12px;cursor:pointer}
.lk .err{color:var(--danger);font-size:14px;min-height:1.2em}
.net{display:inline-block;font-size:11px;border-radius:6px;padding:1px 6px;margin-left:6px;background:var(--accent-soft);color:var(--accent)}
.net.off{background:var(--warn-bg);color:var(--warn-fg)}
.upd{position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:9;background:var(--accent);color:var(--surface);border:0;border-radius:12px;padding:12px 14px;font-size:15px;font-weight:700;box-shadow:0 4px 16px rgba(0,0,0,.25);cursor:pointer;font-family:var(--sans)}
.lockbtn{border:0;background:transparent;color:var(--muted);font-size:12px;cursor:pointer;text-decoration:underline;font-family:var(--sans)}
</style>
</head>
<body>
<div id="lock"><form class="lk" id="lkf" autocomplete="on">
  <div class="logo">AIX</div>
  <h2>AIX 隨身手冊</h2>
  <p>請輸入密碼。輸入一次後，這支手機沒網路也能用。</p>
  <input type="text" name="username" value="aix" autocomplete="username" hidden>
  <input id="pw" type="password" autocomplete="current-password" placeholder="密碼" aria-label="密碼">
  <label><input id="rem" type="checkbox" checked> 記住這支手機，下次不用再輸入</label>
  <div class="err" id="err" role="alert"></div>
  <button type="submit" id="go">開啟</button>
</form></div>
<div id="app" hidden>


<div class="wrap">
  <header>
    <div class="top">
      <button class="hb" id="hb" type="button" aria-label="開啟選單" aria-controls="dr" aria-expanded="false">☰</button>
      <h1 id="ttl">AIX 隨身手冊</h1><span class="count" id="count"></span>
    </div>
    <div class="search">
      <input id="q" type="search" placeholder="搜尋：滿了、換硬碟、lspath、NTP…" autocomplete="off" aria-label="搜尋">
      <button id="clear" type="button" aria-label="清除搜尋" hidden>×</button>
    </div>
    <div class="rail" id="tabs" aria-label="分類" hidden></div>
    <div class="rail sub" id="subs" aria-label="子分類" hidden></div>
  </header>
  <main id="main"></main>
  <footer id="foot"></footer>
</div>
<div class="ov" id="ov"></div>
<nav class="dr" id="dr" aria-label="選單">
  <div class="dh"><h2>AIX 隨身手冊</h2><button class="dx" id="dx" type="button" aria-label="關閉選單">×</button></div>
  <div class="dbody" id="dbody"></div>
  <div class="vline"><span id="ver"></span></div>
</nav>


</div>
<script type="text/plain" id="appsrc">
const D = window.__AIXDATA;
const FS=[14,15,16.5,18], FSN=['小','標準','大','特大'];
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const DANGER = /(刪除|強制|風險|勿用|重開|無法復原|會覆蓋|資料會|不可逆)/;
const ld = (k, d) => { try { const v = JSON.parse(localStorage.getItem(k)); return v == null ? d : v; } catch (e) { return d; } };
const sv = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} };
const SOS = D.sos || [];
const USED = new Set(SOS.map(s => s.flow).filter(Boolean));
const FLOWS = []; D.tabs.forEach(t => t.flows.forEach(f => { if (!USED.has(f.name)) FLOWS.push(Object.assign({ tab: t }, f)); }));
const DESTRUCT = /\b(rmdev|reducevg|unmirrorvg|rmlv|rmfs|rmvg|exportvg|rmpath|shutdown|reboot|halt|cfgmgr -d|rm -rf?|mkvg -f|chpv -c|savebase)\b/;
const PLATS = []; D.tabs.forEach(t => { if (!PLATS.includes(t.p)) PLATS.push(t.p); });
const platOf = {}; D.tabs.forEach(t => platOf[t.id] = t.p);
const platCount = {}; D.rows.forEach(r => platCount[platOf[r.t]] = (platCount[platOf[r.t]] || 0) + 1);
let state = { view: ld('aix_view', 'cmd'), plat: ld('aix_plat', PLATS[0]), tab: 'all', sub: null, q: '', sos: null, flow: null };
if (!platCount[state.plat]) state.plat = PLATS.find(p => platCount[p]) || PLATS[0];
if (!['cmd','sos','fav','recent','menus'].includes(state.view)) state.view = 'cmd';
let fav = ld('aix_fav', []), recent = ld('aix_recent', []), fsi = ld('aix_fs', 1);
const openSet = new Set();
const byC = {}; D.rows.forEach(r => byC[r.c] = r);
const tabCount = {}; D.rows.forEach(r => tabCount[r.t] = (tabCount[r.t] || 0) + 1);
const short = t => t.label;
function applyFs(){ document.documentElement.style.setProperty('--fs', FS[fsi] + 'px'); }
applyFs();
const SYN=[
['擴充','加大','增加','擴大','放大','size=','extend'],['空間','size','df','容量','滿了','full'],['檔案系統','fs','filesystem','crfs','chfs','掛載點'],
['刪除','移除','rmdev','rmlv','rmfs','rmpath','remove'],['更換','替換','換掉','換','replace','hot plug'],['硬碟','hdisk','disk','磁碟','pdisk','pv'],['壞','故障','壞掉','failed','fail','error','missing'],
['網卡','ent','en0','adapter','網路卡'],['斷線','link','status','連不上','不通'],['路徑','path','lspath','mpio'],['時間','ntp','date','校時','時區','tz','xntpd','不準','跑掉'],
['密碼','passwd','pwd','pwdadm'],['帳號','user','lsuser','chuser','mkuser'],['鎖','locked','account_locked','unsuccessful'],['過期','maxage','expired','adm'],
['備份','mksysb','backup','savevg'],['還原','restore','restvg','restorevgfiles'],['錯誤','errpt','error','log'],['磁帶','tape','rmt','tctl'],
['光衰','sfpshow','power'],['記憶體','memory','mem','svmon','realmem'],['開機','boot','bootlist','bosboot','開不了機','led'],['版本','oslevel','level','version','ioslevel','halevel'],
['鏡像','mirror','mirrorvg','鏡射'],['效能','topas','nmon','vmstat','iostat','慢'],['服務','lssrc','startsrc','stopsrc','refresh'],['韌體','firmware','fw','lsmcode','microcode'],
['光碟','cd0','iso','dvd','vopt'],['切換','move','fallover','failover','移轉'],['燈','led','indicator','燈號','亮燈']];
const STOP=/[了的嗎呢吧怎麼如何要想請我看查找一下什麼個]/g;
const ALLSYN=SYN.flat().filter(w=>/[^\x00-\x7f]/.test(w)).sort((x,y)=>y.length-x.length);
function alts(t){const g=SYN.find(a=>a.some(x=>x.toLowerCase()===t));return g?g.map(x=>x.toLowerCase()):[t];}
function terms(){
  const out=[];
  state.q.toLowerCase().split(/\s+/).filter(Boolean).forEach(term=>{
    if(!/[^\x00-\x7f]/.test(term)){out.push({w:term,alts:alts(term),req:true});return;}
    let rest=term, found=[];
    ALLSYN.forEach(w=>{ if(rest.includes(w)){found.push(w); rest=rest.split(w).join(' ');} });
    rest.split(/[\s]+/).forEach(seg=>{ seg.split(/([\x00-\x7f]+)/).forEach(p=>{ p=p.trim(); if(!p) return;
      if(/^[\x00-\x7f]+$/.test(p)) { out.push({w:p,alts:alts(p),req:true}); return; }
      p=p.replace(STOP,''); if(p.length>=2) out.push({w:p,alts:[p],req:!found.length}); }); });
    found.forEach(w=>out.push({w:w,alts:alts(w),req:true}));
    out.push({w:term,alts:[term],req:false,phrase:true});
  });
  state.q.toLowerCase().split(/\s+/).filter(w=>w && !/[^\x00-\x7f]/.test(w)).forEach(w=>out.push({w,alts:[w],req:false,phrase:true}));
  return out;
}
const RX={};
function has(hay,a){ if(/[^\x00-\x7f]/.test(a)||/[^a-z0-9_\-]/.test(a)) return hay.includes(a);
  const re=RX[a]||(RX[a]=new RegExp('(?<![a-z0-9_])'+a.replace(/[-]/g,'\\-')+'(?![a-z_])')); return re.test(hay); }
function matchScore(pri, sec, ts, sub, loose){
  let sc=0, hit=0;
  for(const t of ts){
    const inP=t.alts.some(a=>has(pri,a)), inS=inP||t.alts.some(a=>has(sec,a));
    if(t.req && !inS && !loose) return -1;
    if(!t.phrase && inS) hit++;
    if(sub && t.alts.some(a=>has(sub,a))) sc+=2;
    if(t.phrase){ if(inP) sc+=6; else if(inS) sc+=3; }
    else sc += inP ? 3 : (inS ? 1 : 0);
  }
  return loose && !hit ? -1 : sc;
}
function hl(text, tk){
  let s = esc(text); if (!tk.length) return s;
  const ws=[...new Set(tk.flatMap(t=>t.alts))].filter(w=>w.length>=2 && !(w.length<3 && /^[a-z]+$/.test(w))).sort((x,y)=>y.length-x.length);
  ws.forEach(t => { const re = new RegExp('(' + t.replace(/[.*+?^${}()|[\]\\]/g, '\\$&').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;') + ')', 'gi'); s = s.replace(/(<[^>]*>)|([^<]+)/g, (m, tag, txt) => tag || txt.replace(re, '<mark>$1</mark>')); });
  return s;
}
function ph(html){ return html.replace(/(<[^>]*>)|([^<]+)/g, (m, tag, txt) => tag || txt.replace(/&lt;[^&\s/]{1,20}&gt;|[一-鿿]+|(?<![A-Za-z])(hdiskX|hdisk|LPAR|PID|WWPN)(?![A-Za-z0-9])/g, '<em class="ph">$&</em>')); }

// ---- 一列指令：平常只有指令＋說明；點開才有範例、注意、按鈕 ----
function row(r, ts, showP){
  const isOpen = openSet.has(r.id), on = fav.includes(r.c);
  let more = '';
  if (isOpen) {
    const dg = r.n && DANGER.test(r.n);
    more = '<div class="more">'
      + (r.e ? `<div class="bx"><b>範例</b><code>${ph(hl(r.e, ts))}</code></div>` : '')
      + (r.n ? `<div class="bx${dg ? ' dg' : ''}"><b>${dg ? '⚠ 注意' : '注意事項'}</b>${hl(r.n, ts).replace(/\n/g, '<br>')}</div>` : '')
      + `<div class="meta">${esc(platOf[r.t] || '')} · ${esc(short(D.tabs.find(t => t.id === r.t) || { label: r.t }))} · ${esc(r.s)} · ${esc(r.id)}</div>`
      + `<div class="acts"><button class="btn pri" type="button" data-copy="${esc(r.c)}">複製指令</button><button class="btn" type="button" data-fav="${esc(r.c)}">${on ? '★ 已收藏' : '☆ 收藏'}</button></div></div>`;
  }
  return `<div class="r${isOpen ? ' open' : ''}" data-id="${esc(r.id)}"><code>${ph(hl(r.c, ts))}${showP ? `<span class="pf">${esc(platOf[r.t] || '')}</span>` : ''}</code><div class="u">${hl(r.u || '（待補說明）', ts)}</div>${more}</div>`;
}
function grouped(rows, ts, showTab){
  let h = '', last = '';
  rows.forEach(r => {
    const g = (showTab ? short(D.tabs.find(t => t.id === r.t) || { label: r.t }) + ' · ' : '') + r.s;
    if (g !== last) { h += `<div class="gh">${esc(g)}</div>`; last = g; }
    h += row(r, ts);
  });
  return `<div class="list">${h}</div>`;
}
// ---- 現場急救 ----
function sosGrid(){
  return '<div class="grid">' + SOS.map((s, i) => `<button class="card" type="button" data-sos="${i}"><span class="e">${esc(s.icon)}</span><span class="t">${esc(s.name)}</span><span class="d">${esc(s.desc)}</span></button>`).join('') + '</div>';
}
function stepsHTML(title, sub, steps){
  return `<button class="back" type="button" data-back="1">‹ 回現場急救</button><div class="sosh"><h2>${esc(title)}</h2>${sub ? `<p>${esc(sub)}</p>` : ''}</div><div class="steps">`
    + steps.map((s, i) => `<div class="stp"><span class="n">${i + 1}</span><div class="x">${esc(s[1] || '')}${s[0] ? `<code>${ph(esc(s[0]))}</code><button class="cp" type="button" data-copy="${esc(s[0])}">複製</button>` : ''}${(s[2] || DESTRUCT.test(s[0] || '')) ? `<div class="w">⚠ ${esc(s[2] || '這一步會移除東西或重開機，先確認對象正確')}</div>` : ''}</div></div>`).join('') + '</div>';
}
// ---- 選單 ----
function big(id, icon, label, n, cls){ return `<button class="big${cls ? ' ' + cls : ''}" type="button" data-view="${id}" aria-current="${state.view === id}"><i>${icon}</i>${esc(label)}<b>${n}</b></button>`; }
function renderDrawer(){
  let h = big('sos', '🚑', '現場急救', SOS.length, 'sos') + big('cmd', '⌨️', '指令', D.rows.length) + PLATS.filter(p => platCount[p]).map(p => `<button class="pl" type="button" data-plat="${esc(p)}" aria-current="${state.view === 'cmd' && state.plat === p}">${esc(p)}<b>${platCount[p]}</b></button>`).join('')
    + '<button class="big" type="button" disabled><i>📜</i>Script<b>準備中</b></button><button class="big" type="button" disabled><i>📄</i>文件 / SOP<b>準備中</b></button>'

  $('#dbody').innerHTML = h;
}
const TITLES = { cmd: '指令', sos: '🚑 現場急救', fav: '★ 我的最愛', recent: '🕘 最近複製', menus: '選單路徑' };
function renderHead(){
  $('#ttl').textContent = state.q ? '搜尋' : state.view === 'cmd' ? state.plat + ' 指令' : TITLES[state.view];
  const showTabs = state.view === 'cmd' && !state.q;
  $('#tabs').hidden = !showTabs; $('#subs').hidden = true;
  if (showTabs) {
    const ptabs = D.tabs.filter(t => t.p === state.plat && tabCount[t.id]);
    if (ptabs.length === 1) { state.tab = ptabs[0].id; $('#tabs').hidden = true; }
    $('#tabs').innerHTML = `<button class="chip" type="button" data-tab="all" aria-pressed="${state.tab === 'all'}">全部</button>`
      + ptabs.map(t => `<button class="chip" type="button" data-tab="${esc(t.id)}" aria-pressed="${state.tab === t.id}">${esc(short(t))}</button>`).join('');
    const tab = D.tabs.find(t => t.id === state.tab);
    if (tab) {
      const c = {}; D.rows.filter(r => r.t === tab.id).forEach(r => c[r.s] = (c[r.s] || 0) + 1);
      const subs = tab.subs.filter(s => c[s]);
      if (subs.length > 1) { $('#subs').innerHTML = `<button class="chip" type="button" data-sub="" aria-pressed="${!state.sub}">全部</button>` + subs.map(s => `<button class="chip" type="button" data-sub="${esc(s)}" aria-pressed="${state.sub === s}">${esc(s)} ${c[s]}</button>`).join(''); $('#subs').hidden = false; }
    }
  }
}
function render(){
  renderHead();
  const ts = terms(); let h = '', n = 0;
  if (ts.length) {
    const collect = loose => {
      const items = D.rows.map((r,i) => ({i, sc: matchScore((r.c + ' ' + r.u + ' ' + r.s + ' ' + r.t.split('_')[1]).toLowerCase(), (r.e + ' ' + r.n + ' ' + r.k).toLowerCase(), ts, r.s.toLowerCase(), loose), r})).filter(x => x.sc >= 0);
      const ss = SOS.map((s, i) => ({ i, sc: matchScore((s.name + ' ' + s.desc + ' ' + (s.k || '')).toLowerCase(), JSON.stringify(s.steps).toLowerCase(), ts, '', loose) })).filter(x => x.sc >= 0);
      const fl = FLOWS.map((f, i) => ({ i, sc: matchScore((f.name + ' ' + f.tab.label).toLowerCase(), JSON.stringify(f.steps).toLowerCase(), ts, '', loose) })).filter(x => x.sc >= 0);
      return [items, ss, fl]; };
    let lead = '';
    let [items, ss, fl] = collect(false);
    if (!items.length && !ss.length && !fl.length) { [items, ss, fl] = collect(true); if (items.length || ss.length || fl.length) lead = '沒有完全符合的，以下是部分符合的'; }
    items.sort((x,y) => y.sc - x.sc || x.i - y.i); ss.sort((x,y) => y.sc - x.sc); fl.sort((x,y) => y.sc - x.sc);
    if (lead) h += `<p class="lead">${lead}</p>`;
    if (ss.length || fl.length) {
      h += '<div class="hd">🚑 現場急救</div>' + (ss.length ? '<div class="grid" style="margin-top:0">' + ss.map(x => { const s = SOS[x.i]; return `<button class="card" type="button" data-sos="${x.i}"><span class="e">${esc(s.icon)}</span><span class="t">${esc(s.name)}</span><span class="d">${esc(s.desc)}</span></button>`; }).join('') + '</div>' : '')
        + (fl.length ? `<div class="list flows" style="margin-top:8px">${fl.map(x => `<button class="fl" type="button" data-flow="${x.i}">${esc(FLOWS[x.i].name)}<span>${FLOWS[x.i].steps.length} 步 ›</span></button>`).join('')}</div>` : '');
    }
    if (items.length) h += `<div class="hd">⌨️ 指令 ${items.length}</div>` + `<div class="list">${items.map(x => row(x.r, ts, true)).join('')}</div>`;
    n = items.length + ss.length + fl.length;
    if (!n) h = `<div class="empty" style="margin-top:12px;border-radius:12px">找不到「${esc(state.q)}」<br>試試較短的關鍵字，或改用英文指令名稱</div>`;
  } else if (state.view === 'sos') {
    if (state.sos != null) { const s = SOS[state.sos]; h = stepsHTML(s.icon + ' ' + s.name, s.sub || s.desc, s.steps); n = s.steps.length; }
    else if (state.flow != null) { const f = FLOWS[state.flow]; h = stepsHTML(f.name, f.tab.label, f.steps.map(s => [s[1], s[2], ''])); n = f.steps.length; }
    else {
      h = '<p class="lead">遇到什麼狀況？點一下看處理步驟</p>' + sosGrid()

      n = SOS.length + FLOWS.length;
    }
  } else if (state.view === 'menus') {
    h = '<p class="lead">smitty / diag / ASMI 選單怎麼走</p><div class="list">' + D.menus.map(m => `<div class="menu"><span class="pill">${esc(m.tool)}</span><div class="p">${esc(m.path)}</div><div class="u" style="font-size:.86em;color:var(--muted)">${esc(m.use)}</div></div>`).join('') + '</div>';
    n = D.menus.length;

    const arr = (state.view === 'fav' ? fav : recent).map(c => byC[c]).filter(Boolean); n = arr.length;
    h = `<p class="lead">${state.view === 'fav' ? '點開任何指令，按「☆ 收藏」就會放到這裡（只存在這支手機）' : '最近按過「複製」的指令（最多 30 個）'}</p>`
      + (n ? `<div class="list" style="margin-top:10px">${arr.map(r => row(r, ts, true)).join('')}</div>` : `<div class="empty" style="margin-top:10px;border-radius:12px">${state.view === 'fav' ? '還沒有收藏的指令' : '還沒有複製過指令'}</div>`);
  } else {

    n = rows.length;

      if (rc.length) h += '<div class="hd">🕘 最近複製</div><div class="list">' + rc.map(r => row(r, ts)).join('') + '</div><div class="hd">全部指令</div>';

function go(view){ state.view = view; state.tab = 'all'; state.sub = null; state.sos = null; state.flow = null; state.q = ''; $('#q').value = ''; sv('aix_view', view); }
function menu(on){ document.body.classList.toggle('menu-open', on); $('#hb').setAttribute('aria-expanded', on); if (on) renderDrawer(); }

$('#ov').addEventListener('click', () => menu(false));

$('#dbody').addEventListener('click', e => {
  const f = e.target.closest('[data-fs]'); if (f) { fsi = Math.max(0, Math.min(FS.length - 1, fsi + (+f.dataset.fs))); sv('aix_fs', fsi); applyFs(); renderDrawer(); return; }

  go(v.dataset.view); render(); menu(false); scrollTo(0, 0);
});
$('#tabs').addEventListener('click', e => { const b = e.target.closest('[data-tab]'); if (!b) return; state.tab = b.dataset.tab; state.sub = null; render(); scrollTo(0, 0); });
$('#subs').addEventListener('click', e => { const b = e.target.closest('[data-sub]'); if (!b) return; state.sub = b.dataset.sub || null; render(); scrollTo(0, 0); });

$('#clear').addEventListener('click', () => { $('#q').value = ''; state.q = ''; render(); $('#q').focus(); });
function copy(b, c){
  recent = [c, ...recent.filter(x => x !== c)].slice(0, 30); sv('aix_recent', recent);
  const t0 = b.textContent;
  const done = () => { b.textContent = '已複製'; b.classList.add('ok'); setTimeout(() => { b.textContent = t0; b.classList.remove('ok'); }, 1500); };
  const fallback = () => { const code = b.closest('.r, .stp').querySelector('code'); const r = document.createRange(); r.selectNodeContents(code); const s = getSelection(); s.removeAllRanges(); s.addRange(r); b.textContent = '已選取，請長按複製'; };
  try { navigator.clipboard.writeText(c).then(done, fallback); } catch (err) { fallback(); }
}
$('#main').addEventListener('click', e => {
  const cp = e.target.closest('[data-copy]'); if (cp) { copy(cp, cp.dataset.copy); return; }
  const fv = e.target.closest('[data-fav]'); if (fv) { const c = fv.dataset.fav; fav = fav.includes(c) ? fav.filter(x => x !== c) : [c, ...fav]; sv('aix_fav', fav); render(); return; }
  const so = e.target.closest('[data-sos]'); if (so) { const i = +so.dataset.sos; go('sos'); state.sos = i; render(); scrollTo(0, 0); return; }
  const fl = e.target.closest('[data-flow]'); if (fl) { const i = +fl.dataset.flow; go('sos'); state.flow = i; render(); scrollTo(0, 0); return; }
  if (e.target.closest('[data-back]')) { state.sos = null; state.flow = null; render(); scrollTo(0, 0); return; }
  if (e.target.closest('.more')) return;
  const r = e.target.closest('.r'); if (!r) return;
  const id = r.dataset.id; openSet.has(id) ? openSet.delete(id) : openSet.add(id); render();
});
$('#ver').textContent = (typeof VER === 'string' && /^\d{8}-\d{4}/.test(VER)) ? '版本 ' + VER.slice(4, 6) + '/' + VER.slice(6, 8) + ' ' + VER.slice(9, 11) + ':' + VER.slice(11, 13) : '更新 ' + D.ver;
$('#foot').textContent = `共 ${D.rows.length} 個指令 · 搜尋會找全部平台 · 橘色字要換成實際值`;
render();
</script>

const VER = "20261013-171438";
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function unlock(pw){
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
  const key = await crypto.subtle.deriveKey({name:'PBKDF2', salt:b64(P.s), iterations:P.n, hash:'SHA-256'}, base, {name:'AES-GCM', length:256}, false, ['decrypt']);
  const buf = await crypto.subtle.decrypt({name:'AES-GCM', iv:b64(P.i)}, key, b64(P.c));
  return JSON.parse(new TextDecoder().decode(buf));
}
function store(k, v){ try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch (e) {} }
function load(k){ try { return localStorage.getItem(k); } catch (e) { return null; } }
function open(data){
  window.__AIXDATA = data;
  document.getElementById('lock').hidden = true;
  document.getElementById('app').hidden = false;
  const s = document.createElement('script'); s.textContent = document.getElementById('appsrc').textContent; document.body.appendChild(s);
  const v = document.getElementById('ver');
  const net = document.createElement('span'); net.className = 'net';
  const upd = () => { net.textContent = navigator.onLine ? '連線中' : '離線'; net.classList.toggle('off', !navigator.onLine); };
  upd(); addEventListener('online', upd); addEventListener('offline', upd); v.after(net);
  const f = document.getElementById('foot');
  const lb = document.createElement('button'); lb.className = 'lockbtn'; lb.type = 'button'; lb.textContent = '登出（清除此手機記住的密碼）';
  lb.onclick = () => { store('aix_pw', null); location.reload(); };
  f.append(document.createElement('br'), 'App 版本 ' + VER + '　', lb);
  checkUpdate();
}
async function checkUpdate(){
  if (!navigator.onLine) return;
  try {
    const t = await (await fetch('./index.html?check=' + Date.now(), {cache:'no-store'})).text();
    const m = t.match(/const VER = "([^"]+)"/);
    if (m && m[1] !== VER) {
      const b = document.createElement('button'); b.className = 'upd'; b.type = 'button';
      b.textContent = '有新版本 ' + m[1] + '，點這裡更新';
      b.onclick = async () => { try { const r = await navigator.serviceWorker.getRegistration(); if (r) await r.update(); } catch (e) {} location.reload(); };
      document.body.appendChild(b);
    }
  } catch (e) {}
}
document.getElementById('lkf').addEventListener('submit', async e => {
  e.preventDefault();
  const pw = document.getElementById('pw').value, err = document.getElementById('err'), go = document.getElementById('go');
  if (!pw) { err.textContent = '請輸入密碼'; return; }
  go.disabled = true; go.textContent = '開啟中…'; err.textContent = '';
  try { const d = await unlock(pw); store('aix_pw', document.getElementById('rem').checked ? pw : null); open(d); }
  catch (x) { err.textContent = '密碼不正確，請再試一次'; go.disabled = false; go.textContent = '開啟'; }
});
(async () => {
  const saved = load('aix_pw');
  if (saved) { try { open(await unlock(saved)); } catch (e) { store('aix_pw', null); } }
})();
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
