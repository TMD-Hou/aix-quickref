<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0C6B70">
<meta name="robots" content="noindex,nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="AIX速查">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<title>AIX 指令速查</title>
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}

/* Layout: one-column phone-first reference; sticky search + category rail, cards of terminal-style commands */
:root{
  --bg:#EEF2F4; --surface:#FFFFFF; --fg:#13222C; --muted:#5B6B75; --line:#D6DEE3;
  --accent:#0C6B70; --accent-soft:#D7ECEC; --term:#0E1B23; --term-fg:#E4F0EF; --prompt:#5FD3A0;
  --warn-bg:#FFF4DE; --warn-fg:#8A5300; --danger:#B42318; --mark:#FFE58F;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft JhengHei","PingFang TC","Noto Sans TC",sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0B1419; --surface:#13212A; --fg:#E3ECEF; --muted:#93A5AE; --line:#24363F;
  --accent:#5CC9C2; --accent-soft:#163A3C; --term:#060D12; --term-fg:#E4F0EF; --prompt:#5FD3A0;
  --warn-bg:#3A2A0E; --warn-fg:#F5C46B; --danger:#FF8A80; --mark:#7A5D00; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0B1419; --surface:#13212A; --fg:#E3ECEF; --muted:#93A5AE; --line:#24363F;
  --accent:#5CC9C2; --accent-soft:#163A3C; --term:#060D12; --term-fg:#E4F0EF; --prompt:#5FD3A0;
  --warn-bg:#3A2A0E; --warn-fg:#F5C46B; --danger:#FF8A80; --mark:#7A5D00; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:15px;line-height:1.5;-webkit-text-size-adjust:100%}
.wrap{max-width:760px;margin:0 auto;padding-inline:16px;padding-block:0 40px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:12px 8px;margin-inline:-16px;padding-inline:16px;border-bottom:1px solid var(--line)}
.top{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
h1{font-size:19px;margin:0;letter-spacing:.02em}
h1 small{font-size:12px;color:var(--muted);font-weight:500;margin-left:6px}
.count{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.search{position:relative;margin-top:10px}
.search input{width:100%;font-size:16px;padding:12px 40px 12px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);color:var(--fg);font-family:var(--sans)}
.search input::-webkit-search-cancel-button{display:none}
.search input:focus{outline:none;border-color:var(--accent)}
.search button{position:absolute;right:6px;top:50%;transform:translateY(-50%);border:0;background:transparent;color:var(--muted);font-size:20px;width:34px;height:34px;border-radius:8px;cursor:pointer}
.rail{display:flex;gap:6px;overflow-x:auto;margin-top:10px;padding-bottom:4px;scrollbar-width:none}
.rail::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:999px;padding:6px 12px;font-size:14px;cursor:pointer;font-family:var(--sans);white-space:nowrap}
.chip b{font-weight:600;color:var(--muted);font-size:11px;margin-left:4px;font-variant-numeric:tabular-nums}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.chip[aria-pressed="true"] b{color:var(--surface);opacity:.8}
.subrail .chip{font-size:13px;padding:4px 10px;background:transparent}
.subrail .chip[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent);border-color:var(--accent)}
.chip:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.quick{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin-top:10px}
.quick button{border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:10px;padding:8px 2px;font-size:13px;line-height:1.25;cursor:pointer;font-family:var(--sans)}
.quick button span{display:block;font-size:18px;line-height:1.1;margin-bottom:2px;color:var(--accent);font-weight:700;font-family:var(--mono)}
.quick button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.desc{color:var(--muted);font-size:13px;margin:12px 0 4px}
.list{display:flex;flex-direction:column;gap:10px;margin-top:10px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;min-width:0}
.meta{display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.pill{background:var(--accent-soft);color:var(--accent);border-radius:6px;padding:1px 7px;font-weight:600}
.id{margin-left:auto;font-family:var(--mono);font-size:11px}
.cmd{display:flex;align-items:flex-start;gap:8px;background:var(--term);color:var(--term-fg);border-radius:8px;padding:9px 10px;margin-top:8px}
.cmd code{flex:1;min-width:0;font-family:var(--mono);font-size:14px;line-height:1.45;white-space:pre-wrap;word-break:break-word}
.cmd code::before{content:"# ";color:var(--prompt)}
.copy{flex:0 0 auto;border:1px solid #2C4553;background:transparent;color:var(--term-fg);font-size:12px;border-radius:6px;padding:3px 8px;cursor:pointer;font-family:var(--sans)}
.copy.ok{color:var(--prompt);border-color:var(--prompt)}
.use{margin-top:8px;font-weight:600}
.row{margin-top:6px;font-size:14px;display:grid;grid-template-columns:3.2em 1fr;gap:6px}
.row span:first-child{color:var(--muted);font-size:12px;padding-top:2px}
.row .mono{font-family:var(--mono);font-size:13px;word-break:break-word;min-width:0}
.row.warn{background:var(--warn-bg);color:var(--warn-fg);border-radius:8px;padding:6px 8px}
.row.warn span:first-child{color:var(--warn-fg)}
.row.danger{color:var(--danger)}
mark{background:var(--mark);color:inherit;border-radius:3px;padding:0 1px}
.cmd mark{background:#7A5D00;color:#fff}
.empty{text-align:center;color:var(--muted);padding:40px 12px}
.flow{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px}
.flow h3{margin:0 0 4px;font-size:16px}
.flow .tab{font-size:12px;color:var(--accent);font-weight:600}
.flow ol{margin:8px 0 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px}
.flow li{display:grid;grid-template-columns:26px 1fr;gap:8px;align-items:start}
.flow .n{width:24px;height:24px;border-radius:50%;background:var(--accent);color:var(--surface);font-size:12px;font-weight:700;display:grid;place-items:center;font-variant-numeric:tabular-nums}
.flow .s{min-width:0}
.flow .s code{display:block;font-family:var(--mono);font-size:13px;background:var(--term);color:var(--term-fg);padding:5px 8px;border-radius:6px;white-space:pre-wrap;word-break:break-word}
.flow .s div{font-size:13px;color:var(--muted);margin-top:2px}
.menu{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.menu .p{font-family:var(--mono);font-size:13px;word-break:break-word}
.menu .u{font-size:13px;color:var(--muted);margin-top:4px}
footer{margin-top:24px;font-size:12px;color:var(--muted);text-align:center}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}


#lock{min-height:100vh;display:flex;align-items:center;justify-content:center;padding-inline:16px;padding-block:24px}
.lk{width:100%;max-width:360px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:24px 20px;display:flex;flex-direction:column;gap:12px}
.lk .logo{width:56px;height:56px;border-radius:14px;background:var(--term);color:var(--prompt);font-family:var(--mono);font-weight:700;display:grid;place-items:center;font-size:18px}
.lk h2{margin:0;font-size:20px}.lk p{margin:0;color:var(--muted);font-size:14px}
.lk input[type=password]{width:100%;font-size:16px;padding:12px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg);color:var(--fg)}
.lk input[type=password]:focus{outline:none;border-color:var(--accent)}
.lk label{display:flex;gap:8px;align-items:center;font-size:14px;color:var(--muted)}
.lk button{border:0;background:var(--accent);color:var(--surface);font-size:16px;font-weight:700;padding:12px;border-radius:12px;cursor:pointer}
.lk .err{color:var(--danger);font-size:14px;min-height:1.2em}
.net{display:inline-block;font-size:11px;border-radius:6px;padding:1px 6px;margin-left:6px;background:var(--accent-soft);color:var(--accent)}
.net.off{background:var(--warn-bg);color:var(--warn-fg)}
.upd{position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:9;background:var(--accent);color:var(--surface);border:0;border-radius:12px;padding:12px 14px;font-size:15px;font-weight:700;box-shadow:0 4px 16px rgba(0,0,0,.25);cursor:pointer;font-family:var(--sans)}
.lockbtn{border:0;background:transparent;color:var(--muted);font-size:12px;cursor:pointer;text-decoration:underline;font-family:var(--sans)}
</style>
</head>
<body>
<div id="lock"><form class="lk" id="lkf" autocomplete="on">
  <div class="logo">AIX</div>
  <h2>AIX 指令速查</h2>
  <p>請輸入密碼。輸入一次後，這支手機沒網路也能用。</p>
  <input type="text" name="username" value="aix" autocomplete="username" hidden>
  <input id="pw" type="password" autocomplete="current-password" placeholder="密碼" aria-label="密碼">
  <label><input id="rem" type="checkbox" checked> 記住這支手機，下次不用再輸入</label>
  <div class="err" id="err" role="alert"></div>
  <button type="submit" id="go">開啟</button>
</form></div>
<div id="app" hidden>
<div class="wrap">
  <header>
    <div class="top"><h1>AIX 指令速查<small id="ver"></small></h1><span class="count" id="count"></span></div>
    <div class="search">
      <input id="q" type="search" placeholder="搜尋：擴充、換硬碟、lspath、NTP…" autocomplete="off" aria-label="搜尋指令">
      <button id="clear" type="button" aria-label="清除搜尋" hidden>×</button>
    </div>
    <div class="rail" id="tabs" role="toolbar" aria-label="分類"></div>
    <div class="rail subrail" id="subs" aria-label="子分類" hidden></div>
  </header>
  <div class="quick" id="quick" aria-label="常見狀況"></div>
  <p class="desc" id="desc"></p>
  <div class="list" id="list"></div>
  <footer id="foot"></footer>
</div>

</div>
<script type="text/plain" id="appsrc">
const D = window.__AIXDATA;
const QUICK=[['擴充空間','擴充','+'],['換硬碟','更換硬碟','⇄'],['開不了機','開不了機','⏻'],['收 log','snap','⇩'],['時間不準','時間不準','◷'],['帳號鎖住','帳號鎖住','⊘'],['路徑斷了','路徑','⋔'],['網路不通','網卡斷線','⌁']];
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const DANGER = /(刪除|強制|風險|勿用|重開|無法復原|會覆蓋|資料會)/;
let state = { tab: 'all', sub: null, q: '' };
try { const s = JSON.parse(localStorage.getItem('aixq') || '{}'); if (s.tab) state.tab = s.tab; } catch (e) {}
function save(){ try { localStorage.setItem('aixq', JSON.stringify({ tab: state.tab })); } catch (e) {} }

const tabCount = {}; D.rows.forEach(r => tabCount[r.t] = (tabCount[r.t] || 0) + 1);
const flowCount = D.tabs.reduce((a, t) => a + t.flows.length, 0);
function chip(id, label, n, on){ return `<button class="chip" type="button" data-id="${esc(id)}" aria-pressed="${on}">${esc(label)}${n != null ? `<b>${n}</b>` : ''}</button>`; }
function renderQuick(){ $('#quick').innerHTML = QUICK.map(q => `<button type="button" data-q="${esc(q[1])}" aria-pressed="${state.q===q[1]}"><span>${q[2]}</span>${esc(q[0])}</button>`).join(''); }
function renderTabs(){ renderQuick();
  let h = chip('all', '全部', D.rows.length, state.tab === 'all');
  D.tabs.forEach(t => { if (tabCount[t.id] || t.flows.length) h += chip(t.id, t.label, tabCount[t.id] || 0, state.tab === t.id); });
  h += chip('flows', '常用流程', flowCount, state.tab === 'flows') + chip('menus', '選單路徑', D.menus.length, state.tab === 'menus');
  $('#tabs').innerHTML = h;
  const tab = D.tabs.find(t => t.id === state.tab);
  if (tab && !state.q) {
    const c = {}; D.rows.filter(r => r.t === tab.id).forEach(r => c[r.s] = (c[r.s] || 0) + 1);
    $('#subs').innerHTML = chip('', '全部', null, !state.sub) + tab.subs.filter(s => c[s]).map(s => chip(s, s, c[s], state.sub === s)).join('');
    $('#subs').hidden = false;
  } else $('#subs').hidden = true;
}
const SYN=[
['擴充','加大','增加','擴大','放大','size=','extend'],['空間','size','df','容量','滿了','full'],['檔案系統','fs','filesystem','crfs','chfs','掛載點'],
['刪除','移除','rmdev','rmlv','rmfs','rmpath','remove'],['更換','替換','換掉','換','replace','hot plug'],['硬碟','hdisk','disk','磁碟','pdisk','pv'],['壞','故障','壞掉','failed','fail','error','missing'],
['網卡','ent','en0','adapter','網路卡'],['斷線','link','status','連不上','不通'],['路徑','path','lspath','mpio'],['時間','ntp','date','校時','時區','tz','xntpd','不準','跑掉'],
['密碼','passwd','pwd','pwdadm'],['帳號','user','lsuser','chuser','mkuser'],['鎖','locked','account_locked','unsuccessful'],['過期','maxage','expired','adm'],
['備份','mksysb','backup','savevg'],['還原','restore','restvg','restorevgfiles'],['錯誤','errpt','error','log'],['磁帶','tape','rmt','tctl'],
['光衰','sfpshow','power'],['記憶體','memory','mem','svmon','realmem'],['開機','boot','bootlist','bosboot','開不了機','led'],['版本','oslevel','level','version','ioslevel','halevel'],
['鏡像','mirror','mirrorvg','鏡射'],['效能','topas','nmon','vmstat','iostat','慢'],['服務','lssrc','startsrc','stopsrc','refresh'],['韌體','firmware','fw','lsmcode','microcode'],
['光碟','cd0','iso','dvd','vopt'],['切換','move','fallover','failover','移轉'],['燈','led','indicator','燈號','亮燈']];
const STOP=/[了的嗎呢吧怎麼如何要想請我看查找一下什麼個]/g;
const ALLSYN=SYN.flat().filter(w=>/[^\x00-\x7f]/.test(w)).sort((x,y)=>y.length-x.length);
function alts(t){const g=SYN.find(a=>a.some(x=>x.toLowerCase()===t));return g?g.map(x=>x.toLowerCase()):[t];}
function terms(){
  const out=[];
  state.q.toLowerCase().split(/\s+/).filter(Boolean).forEach(term=>{
    if(!/[^\x00-\x7f]/.test(term)){out.push({w:term,alts:alts(term),req:true});return;}
    let rest=term, found=[];
    ALLSYN.forEach(w=>{ if(rest.includes(w)){found.push(w); rest=rest.split(w).join(' ');} });
    rest.split(/[\s]+/).forEach(seg=>{ seg.split(/([\x00-\x7f]+)/).forEach(p=>{ p=p.trim(); if(!p) return;
      if(/^[\x00-\x7f]+$/.test(p)) { out.push({w:p,alts:alts(p),req:true}); return; }
      p=p.replace(STOP,''); if(p.length>=2) out.push({w:p,alts:[p],req:!found.length}); }); });
    found.forEach(w=>out.push({w:w,alts:alts(w),req:true}));
    out.push({w:term,alts:[term],req:false,phrase:true});
  });
  state.q.toLowerCase().split(/\s+/).filter(w=>w && !/[^\x00-\x7f]/.test(w)).forEach(w=>out.push({w,alts:[w],req:false,phrase:true}));
  return out;
}
const RX={};
function has(hay,a){ if(/[^\x00-\x7f]/.test(a)||/[^a-z0-9_\-]/.test(a)) return hay.includes(a);
  const re=RX[a]||(RX[a]=new RegExp('(?<![a-z0-9_])'+a.replace(/[-]/g,'\\-')+'(?![a-z_])')); return re.test(hay); }
function matchScore(pri, sec, ts, sub, loose){
  let sc=0, hit=0;
  for(const t of ts){
    const inP=t.alts.some(a=>has(pri,a)), inS=inP||t.alts.some(a=>has(sec,a));
    if(t.req && !inS && !loose) return -1;
    if(!t.phrase && inS) hit++;
    if(sub && t.alts.some(a=>has(sub,a))) sc+=2;
    if(t.phrase){ if(inP) sc+=6; else if(inS) sc+=3; }
    else sc += inP ? 3 : (inS ? 1 : 0);
  }
  return loose && !hit ? -1 : sc;
}
function hl(text, tk){
  let s = esc(text); if (!tk.length) return s;
  const ws=[...new Set(tk.flatMap(t=>t.alts))].filter(w=>w.length>=2 && !(w.length<3 && /^[a-z]+$/.test(w))).sort((x,y)=>y.length-x.length);
  ws.forEach(t => { const re = new RegExp('(' + t.replace(/[.*+?^${}()|[\]\\]/g, '\\$&').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;') + ')', 'gi'); s = s.replace(/(<[^>]*>)|([^<]+)/g, (m, tag, txt) => tag || txt.replace(re, '<mark>$1</mark>')); });
  return s;
}
function card(r, ts){
  const warn = r.n ? `<div class="row ${DANGER.test(r.n) ? 'warn' : ''}"><span>注意</span><span>${hl(r.n, ts)}</span></div>` : '';
  const ex = r.e ? `<div class="row"><span>範例</span><span class="mono">${hl(r.e, ts)}</span></div>` : '';
  const tabLabel = state.tab === 'all' || state.q ? `<span>${esc(r.t.split('_')[1])}</span>·` : '';
  return `<article class="card"><div class="meta">${tabLabel}<span class="pill">${esc(r.s)}</span>${r.v ? `<span>${esc(r.v)}</span>` : ''}<span class="id">${esc(r.id)}</span></div>
  <div class="cmd"><code>${hl(r.c, ts)}</code><button class="copy" type="button" data-c="${esc(r.c)}">複製</button></div>
  <div class="use">${hl(r.u, ts)}</div>${ex}${warn}</article>`;
}
function flowHTML(t, f){
  return `<section class="flow"><div class="tab">${esc(t.label)}</div><h3>${esc(f.name)}</h3><ol>${f.steps.map(s => `<li><span class="n">${esc(s[0])}</span><div class="s"><code>${esc(s[1])}</code><div>${esc(s[2])}</div></div></li>`).join('')}</ol></section>`;
}
function render(){
  renderTabs();
  const ts = terms(); let h = '', n = 0, desc = '';
  if (state.tab === 'flows' && !ts.length) {
    D.tabs.forEach(t => t.flows.forEach(f => { h += flowHTML(t, f); n++; }));
    desc = '照步驟做的操作流程（與 Excel 各頁籤底部相同）';
  } else if (state.tab === 'menus' && !ts.length) {
    D.menus.forEach(m => { h += `<div class="menu"><div class="pill" style="display:inline-block">${esc(m.tool)}</div><div class="p">${esc(m.path)}</div><div class="u">${esc(m.use)}</div></div>`; n++; });
    desc = 'smitty / diag / ASMI 選單怎麼走';
  } else {
    let rows = D.rows;
    if (ts.length) {
      const collect = loose => { const items = rows.map((r,i) => ({i, sc: matchScore((r.c + ' ' + r.u + ' ' + r.s + ' ' + r.t.split('_')[1]).toLowerCase(), (r.e + ' ' + r.n + ' ' + r.k).toLowerCase(), ts, r.s.toLowerCase(), loose), h: () => card(r, ts)})).filter(x => x.sc >= 0);
      desc = '在全部分類中搜尋';
      D.tabs.forEach(t => t.flows.forEach(f => { const sc = matchScore((f.name + ' ' + t.label).toLowerCase(), JSON.stringify(f.steps).toLowerCase(), ts, '', loose); if (sc >= 0) items.push({i: -1, sc: sc + 1, h: () => flowHTML(t, f)}); })); return items; };
      let items = collect(false); if (!items.length) { items = collect(true); if (items.length) desc = '沒有完全符合的結果，以下是部分符合的指令'; }
      items.sort((x,y) => y.sc - x.sc || x.i - y.i); h = items.map(x => x.h()).join(''); n = items.length;
    } else {
      const tab = D.tabs.find(t => t.id === state.tab);
      if (tab) { rows = rows.filter(r => r.t === tab.id && (!state.sub || r.s === state.sub)); desc = tab.desc; }
      else desc = '依分類排列；上方可切換分類，或直接搜尋中文、英文關鍵字';
      h = rows.map(r => card(r, ts)).join(''); n = rows.length;
      if (tab && !state.sub) tab.flows.forEach(f => h += flowHTML(tab, f));
    }
  }
  $('#list').innerHTML = h || `<div class="empty">找不到「${esc(state.q)}」<br>試試較短的關鍵字，或改用英文指令名稱</div>`;
  $('#count').textContent = n + ' 筆';
  $('#desc').textContent = desc;
  $('#clear').hidden = !state.q;
}
$('#tabs').addEventListener('click', e => { const b = e.target.closest('.chip'); if (!b) return; state.tab = b.dataset.id; state.sub = null; state.q = ''; $('#q').value = ''; save(); render(); window.scrollTo(0, 0); });
$('#quick').addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; const q = state.q === b.dataset.q ? '' : b.dataset.q; state.q = q; $('#q').value = q; render(); window.scrollTo(0, 0); });
$('#subs').addEventListener('click', e => { const b = e.target.closest('.chip'); if (!b) return; state.sub = b.dataset.id || null; render(); window.scrollTo(0, 0); });
let tm; $('#q').addEventListener('input', e => { clearTimeout(tm); tm = setTimeout(() => { state.q = e.target.value.trim(); render(); }, 120); });
$('#clear').addEventListener('click', () => { $('#q').value = ''; state.q = ''; render(); $('#q').focus(); });
$('#list').addEventListener('click', e => {
  const b = e.target.closest('.copy'); if (!b) return;
  const done = () => { b.textContent = '已複製'; b.classList.add('ok'); setTimeout(() => { b.textContent = '複製'; b.classList.remove('ok'); }, 1500); };
  const fallback = () => { const r = document.createRange(); r.selectNodeContents(b.previousElementSibling); const s = getSelection(); s.removeAllRanges(); s.addRange(r); b.textContent = '已選取'; };
  try { navigator.clipboard.writeText(b.dataset.c).then(done, fallback); } catch (err) { fallback(); }
});
$('#ver').textContent = '更新 ' + D.ver;
$('#foot').textContent = `共 ${D.rows.length} 個指令 · 資料來源：AIX指令速查表.xlsx · 中文字代表要換成實際名稱`;
render();
</script>

const VER = "20261013-1340";
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function unlock(pw){
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
  const key = await crypto.subtle.deriveKey({name:'PBKDF2', salt:b64(P.s), iterations:P.n, hash:'SHA-256'}, base, {name:'AES-GCM', length:256}, false, ['decrypt']);
  const buf = await crypto.subtle.decrypt({name:'AES-GCM', iv:b64(P.i)}, key, b64(P.c));
  return JSON.parse(new TextDecoder().decode(buf));
}
function store(k, v){ try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch (e) {} }
function load(k){ try { return localStorage.getItem(k); } catch (e) { return null; } }
function open(data){
  window.__AIXDATA = data;
  document.getElementById('lock').hidden = true;
  document.getElementById('app').hidden = false;
  const s = document.createElement('script'); s.textContent = document.getElementById('appsrc').textContent; document.body.appendChild(s);
  const v = document.getElementById('ver');
  const net = document.createElement('span'); net.className = 'net';
  const upd = () => { net.textContent = navigator.onLine ? '連線中' : '離線'; net.classList.toggle('off', !navigator.onLine); };
  upd(); addEventListener('online', upd); addEventListener('offline', upd); v.after(net);
  const f = document.getElementById('foot');
  const lb = document.createElement('button'); lb.className = 'lockbtn'; lb.type = 'button'; lb.textContent = '登出（清除此手機記住的密碼）';
  lb.onclick = () => { store('aix_pw', null); location.reload(); };
  f.append(document.createElement('br'), 'App 版本 ' + VER + '　', lb);
  checkUpdate();
}
async function checkUpdate(){
  if (!navigator.onLine) return;
  try {
    const t = await (await fetch('./index.html?check=' + Date.now(), {cache:'no-store'})).text();
    const m = t.match(/const VER = "([^"]+)"/);
    if (m && m[1] !== VER) {
      const b = document.createElement('button'); b.className = 'upd'; b.type = 'button';
      b.textContent = '有新版本 ' + m[1] + '，點這裡更新';
      b.onclick = async () => { try { const r = await navigator.serviceWorker.getRegistration(); if (r) await r.update(); } catch (e) {} location.reload(); };
      document.body.appendChild(b);
    }
  } catch (e) {}
}
document.getElementById('lkf').addEventListener('submit', async e => {
  e.preventDefault();
  const pw = document.getElementById('pw').value, err = document.getElementById('err'), go = document.getElementById('go');
  if (!pw) { err.textContent = '請輸入密碼'; return; }
  go.disabled = true; go.textContent = '開啟中…'; err.textContent = '';
  try { const d = await unlock(pw); store('aix_pw', document.getElementById('rem').checked ? pw : null); open(d); }
  catch (x) { err.textContent = '密碼不正確，請再試一次'; go.disabled = false; go.textContent = '開啟'; }
});
(async () => {
  const saved = load('aix_pw');
  if (saved) { try { open(await unlock(saved)); } catch (e) { store('aix_pw', null); } }
})();
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
