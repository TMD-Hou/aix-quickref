<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0C6B70">
<meta name="robots" content="noindex,nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="AIX速查">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<title>AIX 指令速查</title>
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}

/* Layout: phone-first compact list; sticky search, left drawer for categories */
:root{
  --bg:#EEF2F4; --surface:#FFFFFF; --fg:#13222C; --muted:#5B6B75; --line:#D6DEE3;
  --accent:#0C6B70; --accent-soft:#D7ECEC; --term:#0E1B23; --term-fg:#E4F0EF; --prompt:#5FD3A0;
  --warn-bg:#FFF4DE; --warn-fg:#8A5300; --danger:#B42318; --mark:#FFE58F;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft JhengHei","PingFang TC","Noto Sans TC",sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0B1419; --surface:#13212A; --fg:#E3ECEF; --muted:#93A5AE; --line:#24363F;
  --accent:#5CC9C2; --accent-soft:#163A3C; --term:#060D12; --term-fg:#E4F0EF; --prompt:#5FD3A0;
  --warn-bg:#3A2A0E; --warn-fg:#F5C46B; --danger:#FF8A80; --mark:#7A5D00; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0B1419; --surface:#13212A; --fg:#E3ECEF; --muted:#93A5AE; --line:#24363F;
  --accent:#5CC9C2; --accent-soft:#163A3C; --term:#060D12; --term-fg:#E4F0EF; --prompt:#5FD3A0;
  --warn-bg:#3A2A0E; --warn-fg:#F5C46B; --danger:#FF8A80; --mark:#7A5D00; color-scheme:dark}
*{box-sizing:border-box}
html{--fs:15px}
body{background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:var(--fs);line-height:1.5;-webkit-text-size-adjust:100%}
.wrap{max-width:760px;margin:0 auto;padding-inline:16px;padding-block:0 40px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:10px 8px;margin-inline:-16px;padding-inline:16px;border-bottom:1px solid var(--line)}
.top{display:flex;align-items:center;gap:10px}
.hb{flex:0 0 auto;width:42px;height:42px;border-radius:11px;border:1px solid var(--line);background:var(--surface);color:var(--accent);font-size:22px;line-height:1;cursor:pointer}
h1{font-size:19px;margin:0;letter-spacing:.02em;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
h1 small{font-size:11px;color:var(--muted);font-weight:500;margin-left:6px}
.count{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.search{position:relative;margin-top:8px}
.search input{width:100%;font-size:16px;padding:11px 40px 11px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);color:var(--fg);font-family:var(--sans)}
.search input::-webkit-search-cancel-button{display:none}
.search input:focus{outline:none;border-color:var(--accent)}
.search button{position:absolute;right:6px;top:50%;transform:translateY(-50%);border:0;background:transparent;color:var(--muted);font-size:20px;width:34px;height:34px;border-radius:8px;cursor:pointer}
.curl{display:flex;align-items:center;gap:8px;margin-top:7px}
.cur{flex:1;min-width:0;font-size:13px;color:var(--accent);font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vinfo{flex:0 0 auto;font-size:11px;color:var(--muted);white-space:nowrap}
.rail{display:flex;gap:6px;overflow-x:auto;margin-top:7px;padding-bottom:2px;scrollbar-width:none}
.rail::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:999px;padding:4px 11px;font-size:13px;cursor:pointer;font-family:var(--sans);white-space:nowrap}
.chip b{font-weight:600;color:var(--muted);font-size:11px;margin-left:4px;font-variant-numeric:tabular-nums}
.chip[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent);border-color:var(--accent)}
button:focus-visible,.chip:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.quick{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin-top:10px}
.quick button{border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:10px;padding:7px 2px;font-size:13px;line-height:1.25;cursor:pointer;font-family:var(--sans)}
.quick button span{display:block;font-size:17px;line-height:1.1;margin-bottom:2px;color:var(--accent);font-weight:700;font-family:var(--mono)}
.desc{color:var(--muted);font-size:12.5px;margin:10px 0 0}
.list{margin-top:8px;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.list:empty{display:none}
.r{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:4px 8px;align-items:start;padding:9px 10px;border-bottom:1px solid var(--line);cursor:pointer}
.r:last-child{border-bottom:0}
.r.open{background:var(--bg)}
.st{border:0;background:transparent;color:var(--muted);opacity:.55;font-size:1.25em;line-height:1.1;padding:0 2px;cursor:pointer}
.st.on{color:#E8A317;opacity:1}
.r code{font-family:var(--mono);font-size:.93em;font-weight:700;word-break:break-word;white-space:pre-wrap}
.u{font-size:.87em;color:var(--muted);margin-top:1px}
.copy{border:1px solid var(--accent);background:transparent;color:var(--accent);font-size:12px;border-radius:7px;padding:3px 9px;cursor:pointer;font-family:var(--sans);white-space:nowrap}
.copy.ok{background:var(--accent);color:var(--surface)}
.more{grid-column:2 / 4;font-size:.87em;display:flex;flex-direction:column;gap:5px;margin-top:4px}
.more .m{font-size:12px;color:var(--muted)}
.more .ex{display:grid;grid-template-columns:2.6em minmax(0,1fr);gap:6px}
.more .ex span:first-child{color:var(--muted);font-size:12px;padding-top:1px}
.more .ex code{font-weight:400}
.more .wn{background:var(--warn-bg);color:var(--warn-fg);border-radius:7px;padding:5px 8px}
em.ph{font-style:normal;color:var(--warn-fg);background:var(--warn-bg);border-radius:3px;padding:0 2px}
mark{background:var(--mark);color:inherit;border-radius:3px;padding:0 1px}
.empty{text-align:center;color:var(--muted);padding:40px 12px;background:var(--surface)}
.blk{display:flex;flex-direction:column;gap:10px;margin-top:10px}
.flow{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px}
.flow h3{margin:0 0 4px;font-size:16px}
.flow .tab{font-size:12px;color:var(--accent);font-weight:600}
.flow ol{margin:8px 0 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px}
.flow li{display:grid;grid-template-columns:26px minmax(0,1fr);gap:8px;align-items:start}
.flow .n{width:24px;height:24px;border-radius:50%;background:var(--accent);color:var(--surface);font-size:12px;font-weight:700;display:grid;place-items:center}
.flow .s code{display:block;font-family:var(--mono);font-size:.87em;background:var(--term);color:var(--term-fg);padding:5px 8px;border-radius:6px;white-space:pre-wrap;word-break:break-word}
.flow .s div{font-size:.87em;color:var(--muted);margin-top:2px}
.menu{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.menu .p{font-family:var(--mono);font-size:.87em;word-break:break-word}
.menu .u{margin-top:4px}
.pill{display:inline-block;background:var(--accent-soft);color:var(--accent);border-radius:6px;padding:1px 7px;font-weight:600;font-size:12px}
.subhd{font-size:12.5px;color:var(--muted);font-weight:700;margin:14px 2px 0}
footer{margin-top:24px;font-size:12px;color:var(--muted);text-align:center}
.ov{position:fixed;inset:0;background:rgba(5,15,20,.45);z-index:20;opacity:0;pointer-events:none;transition:opacity .2s}
.dr{position:fixed;top:0;bottom:0;left:0;width:min(82vw,340px);background:var(--surface);z-index:21;transform:translateX(-102%);transition:transform .22s ease;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);box-shadow:4px 0 24px rgba(0,0,0,.25)}
body.menu-open .ov{opacity:1;pointer-events:auto}
body.menu-open .dr{transform:none}
body.menu-open{overflow:hidden}
.dh{display:flex;justify-content:space-between;align-items:center;padding:14px 16px 10px;border-bottom:1px solid var(--line)}
.dh h2{margin:0;font-size:17px}
.x{border:0;background:transparent;color:var(--muted);font-size:24px;line-height:1;cursor:pointer;width:36px;height:36px}
.dbody{overflow-y:auto;flex:1;padding-bottom:16px}
.fsz{display:flex;align-items:center;gap:6px;padding:10px 16px;border-bottom:1px solid var(--line);font-size:14px}
.fsz span{flex:1}
.fsz button{border:1px solid var(--line);background:var(--surface);color:var(--accent);font-weight:700;border-radius:8px;padding:4px 10px;cursor:pointer;font-family:var(--sans)}
.fsz output{min-width:2.5em;text-align:center;font-size:13px}
.sec{font-size:11px;color:var(--muted);padding:12px 16px 4px;letter-spacing:.08em}
.it{display:flex;justify-content:space-between;align-items:center;width:100%;border:0;background:transparent;color:var(--fg);font-size:15px;padding:9px 16px;cursor:pointer;font-family:var(--sans);text-align:left}
.it b{font-weight:600;color:var(--muted);font-size:12px;background:var(--bg);border-radius:10px;padding:1px 8px;font-variant-numeric:tabular-nums}
.it[aria-current="true"]{background:var(--accent-soft);color:var(--accent);font-weight:700}
.it[aria-current="true"] b{background:var(--accent);color:var(--surface)}
.dsubs{display:flex;flex-wrap:wrap;gap:6px;padding:6px 16px 10px 26px;background:var(--bg)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}


#lock{min-height:100vh;display:flex;align-items:center;justify-content:center;padding-inline:16px;padding-block:24px}
.lk{width:100%;max-width:360px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:24px 20px;display:flex;flex-direction:column;gap:12px}
.lk .logo{width:56px;height:56px;border-radius:14px;background:var(--term);color:var(--prompt);font-family:var(--mono);font-weight:700;display:grid;place-items:center;font-size:18px}
.lk h2{margin:0;font-size:20px}.lk p{margin:0;color:var(--muted);font-size:14px}
.lk input[type=password]{width:100%;font-size:16px;padding:12px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg);color:var(--fg)}
.lk input[type=password]:focus{outline:none;border-color:var(--accent)}
.lk label{display:flex;gap:8px;align-items:center;font-size:14px;color:var(--muted)}
.lk button{border:0;background:var(--accent);color:var(--surface);font-size:16px;font-weight:700;padding:12px;border-radius:12px;cursor:pointer}
.lk .err{color:var(--danger);font-size:14px;min-height:1.2em}
.net{display:inline-block;font-size:11px;border-radius:6px;padding:1px 6px;margin-left:6px;background:var(--accent-soft);color:var(--accent)}
.net.off{background:var(--warn-bg);color:var(--warn-fg)}
.upd{position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:9;background:var(--accent);color:var(--surface);border:0;border-radius:12px;padding:12px 14px;font-size:15px;font-weight:700;box-shadow:0 4px 16px rgba(0,0,0,.25);cursor:pointer;font-family:var(--sans)}
.lockbtn{border:0;background:transparent;color:var(--muted);font-size:12px;cursor:pointer;text-decoration:underline;font-family:var(--sans)}
</style>
</head>
<body>
<div id="lock"><form class="lk" id="lkf" autocomplete="on">
  <div class="logo">AIX</div>
  <h2>AIX 指令速查</h2>
  <p>請輸入密碼。輸入一次後，這支手機沒網路也能用。</p>
  <input type="text" name="username" value="aix" autocomplete="username" hidden>
  <input id="pw" type="password" autocomplete="current-password" placeholder="密碼" aria-label="密碼">
  <label><input id="rem" type="checkbox" checked> 記住這支手機，下次不用再輸入</label>
  <div class="err" id="err" role="alert"></div>
  <button type="submit" id="go">開啟</button>
</form></div>
<div id="app" hidden>


<div class="wrap">
  <header>
    <div class="top">
      <button class="hb" id="hb" type="button" aria-label="開啟分類選單" aria-controls="dr" aria-expanded="false">☰</button>
      <h1>AIX 指令速查</h1><span class="count" id="count"></span>
    </div>
    <div class="search">
      <input id="q" type="search" placeholder="搜尋：擴充、換硬碟、lspath、NTP…" autocomplete="off" aria-label="搜尋指令">
      <button id="clear" type="button" aria-label="清除搜尋" hidden>×</button>
    </div>
    <div class="curl"><span class="cur" id="cur"></span><span class="vinfo"><span id="ver"></span></span></div>
    <div class="rail" id="subs" aria-label="子分類" hidden></div>
  </header>
  <div class="quick" id="quick" aria-label="常見狀況"></div>
  <p class="desc" id="desc"></p>
  <div class="list" id="list"></div>
  <div class="blk" id="blk"></div>
  <footer id="foot"></footer>
</div>
<div class="ov" id="ov"></div>
<nav class="dr" id="dr" aria-label="分類選單">
  <div class="dh"><h2>分類</h2><button class="x" id="dx" type="button" aria-label="關閉選單">×</button></div>
  <div class="dbody" id="dbody"></div>
</nav>


</div>
<script type="text/plain" id="appsrc">
const D = window.__AIXDATA;
const QUICK=[['擴充空間','擴充','+'],['換硬碟','更換硬碟','⇄'],['開不了機','開不了機','⏻'],['收 log','snap','⇩'],['時間不準','時間不準','◷'],['帳號鎖住','帳號鎖住','⊘'],['路徑斷了','路徑','⋔'],['網路不通','網卡斷線','⌁']];
const FS=[14,15,16.5,18], FSN=['小','標準','大','特大'];
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const DANGER = /(刪除|強制|風險|勿用|重開|無法復原|會覆蓋|資料會)/;
const ld = (k, d) => { try { const v = JSON.parse(localStorage.getItem(k)); return v == null ? d : v; } catch (e) { return d; } };
const sv = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} };
let state = { tab: ld('aix_tab', 'all'), sub: null, q: '' };
let fav = ld('aix_fav', []), recent = ld('aix_recent', []), fsi = ld('aix_fs', 1);
const openSet = new Set();
const byC = {}; D.rows.forEach(r => byC[r.c] = r);
const tabCount = {}; D.rows.forEach(r => tabCount[r.t] = (tabCount[r.t] || 0) + 1);
const flowCount = D.tabs.reduce((a, t) => a + t.flows.length, 0);
if (!['all','fav','recent','flows','menus'].includes(state.tab) && !D.tabs.some(t => t.id === state.tab)) state.tab = 'all';
function applyFs(){ document.documentElement.style.setProperty('--fs', FS[fsi] + 'px'); }
applyFs();
const SYN=[
['擴充','加大','增加','擴大','放大','size=','extend'],['空間','size','df','容量','滿了','full'],['檔案系統','fs','filesystem','crfs','chfs','掛載點'],
['刪除','移除','rmdev','rmlv','rmfs','rmpath','remove'],['更換','替換','換掉','換','replace','hot plug'],['硬碟','hdisk','disk','磁碟','pdisk','pv'],['壞','故障','壞掉','failed','fail','error','missing'],
['網卡','ent','en0','adapter','網路卡'],['斷線','link','status','連不上','不通'],['路徑','path','lspath','mpio'],['時間','ntp','date','校時','時區','tz','xntpd','不準','跑掉'],
['密碼','passwd','pwd','pwdadm'],['帳號','user','lsuser','chuser','mkuser'],['鎖','locked','account_locked','unsuccessful'],['過期','maxage','expired','adm'],
['備份','mksysb','backup','savevg'],['還原','restore','restvg','restorevgfiles'],['錯誤','errpt','error','log'],['磁帶','tape','rmt','tctl'],
['光衰','sfpshow','power'],['記憶體','memory','mem','svmon','realmem'],['開機','boot','bootlist','bosboot','開不了機','led'],['版本','oslevel','level','version','ioslevel','halevel'],
['鏡像','mirror','mirrorvg','鏡射'],['效能','topas','nmon','vmstat','iostat','慢'],['服務','lssrc','startsrc','stopsrc','refresh'],['韌體','firmware','fw','lsmcode','microcode'],
['光碟','cd0','iso','dvd','vopt'],['切換','move','fallover','failover','移轉'],['燈','led','indicator','燈號','亮燈']];
const STOP=/[了的嗎呢吧怎麼如何要想請我看查找一下什麼個]/g;
const ALLSYN=SYN.flat().filter(w=>/[^\x00-\x7f]/.test(w)).sort((x,y)=>y.length-x.length);
function alts(t){const g=SYN.find(a=>a.some(x=>x.toLowerCase()===t));return g?g.map(x=>x.toLowerCase()):[t];}
function terms(){
  const out=[];
  state.q.toLowerCase().split(/\s+/).filter(Boolean).forEach(term=>{
    if(!/[^\x00-\x7f]/.test(term)){out.push({w:term,alts:alts(term),req:true});return;}
    let rest=term, found=[];
    ALLSYN.forEach(w=>{ if(rest.includes(w)){found.push(w); rest=rest.split(w).join(' ');} });
    rest.split(/[\s]+/).forEach(seg=>{ seg.split(/([\x00-\x7f]+)/).forEach(p=>{ p=p.trim(); if(!p) return;
      if(/^[\x00-\x7f]+$/.test(p)) { out.push({w:p,alts:alts(p),req:true}); return; }
      p=p.replace(STOP,''); if(p.length>=2) out.push({w:p,alts:[p],req:!found.length}); }); });
    found.forEach(w=>out.push({w:w,alts:alts(w),req:true}));
    out.push({w:term,alts:[term],req:false,phrase:true});
  });
  state.q.toLowerCase().split(/\s+/).filter(w=>w && !/[^\x00-\x7f]/.test(w)).forEach(w=>out.push({w,alts:[w],req:false,phrase:true}));
  return out;
}
const RX={};
function has(hay,a){ if(/[^\x00-\x7f]/.test(a)||/[^a-z0-9_\-]/.test(a)) return hay.includes(a);
  const re=RX[a]||(RX[a]=new RegExp('(?<![a-z0-9_])'+a.replace(/[-]/g,'\\-')+'(?![a-z_])')); return re.test(hay); }
function matchScore(pri, sec, ts, sub, loose){
  let sc=0, hit=0;
  for(const t of ts){
    const inP=t.alts.some(a=>has(pri,a)), inS=inP||t.alts.some(a=>has(sec,a));
    if(t.req && !inS && !loose) return -1;
    if(!t.phrase && inS) hit++;
    if(sub && t.alts.some(a=>has(sub,a))) sc+=2;
    if(t.phrase){ if(inP) sc+=6; else if(inS) sc+=3; }
    else sc += inP ? 3 : (inS ? 1 : 0);
  }
  return loose && !hit ? -1 : sc;
}
function hl(text, tk){
  let s = esc(text); if (!tk.length) return s;
  const ws=[...new Set(tk.flatMap(t=>t.alts))].filter(w=>w.length>=2 && !(w.length<3 && /^[a-z]+$/.test(w))).sort((x,y)=>y.length-x.length);
  ws.forEach(t => { const re = new RegExp('(' + t.replace(/[.*+?^${}()|[\]\\]/g, '\\$&').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;') + ')', 'gi'); s = s.replace(/(<[^>]*>)|([^<]+)/g, (m, tag, txt) => tag || txt.replace(re, '<mark>$1</mark>')); });
  return s;
}

function ph(html){ return html.replace(/(<[^>]*>)|([^<]+)/g, (m, tag, txt) => tag || txt.replace(/[一-鿿]+|(?<![A-Za-z])(hdisk|LPAR|PID|WWPN)(?![A-Za-z0-9])/g, '<em class="ph">$&</em>')); }
function row(r, ts){
  const isOpen = openSet.has(r.id), on = fav.includes(r.c);
  let more = '';
  if (isOpen) {
    more = `<div class="more"><div class="m">${esc(r.t.split('_').slice(1).join(' ').replace(/_/g,' '))} · ${esc(r.s)}${r.v ? ' · ' + esc(r.v) : ''} · ${esc(r.id)}</div>`
      + (r.e ? `<div class="ex"><span>範例</span><code>${hl(r.e, ts)}</code></div>` : '')
      + (r.n ? `<div class="${DANGER.test(r.n) ? 'wn' : 'ex'}">${DANGER.test(r.n) ? '注意：' + hl(r.n, ts) : '<span>注意</span><span>' + hl(r.n, ts) + '</span>'}</div>` : '')
      + (!r.e && !r.n ? '<div class="m">（沒有範例或注意事項）</div>' : '') + '</div>';
  }
  return `<div class="r${isOpen ? ' open' : ''}" data-id="${esc(r.id)}"><button class="st${on ? ' on' : ''}" type="button" data-fav="${esc(r.c)}" aria-label="${on ? '取消最愛' : '加入最愛'}">${on ? '★' : '☆'}</button>
  <div><code>${ph(hl(r.c, ts))}</code><div class="u">${hl(r.u || '（待補說明）', ts)}</div></div>
  <button class="copy" type="button" data-c="${esc(r.c)}">複製</button>${more}</div>`;
}
function flowHTML(t, f){
  return `<section class="flow"><div class="tab">${esc(t.label)}</div><h3>${esc(f.name)}</h3><ol>${f.steps.map(s => `<li><span class="n">${esc(s[0])}</span><div class="s"><code>${ph(esc(s[1]))}</code><div>${esc(s[2])}</div></div></li>`).join('')}</ol></section>`;
}
function it(id, label, n){ return `<button class="it" type="button" data-tab="${esc(id)}" aria-current="${state.tab === id}"><span>${esc(label)}</span><b>${n}</b></button>`; }
function renderDrawer(){
  let h = `<div class="fsz"><span>字體大小</span><button type="button" data-fs="-1" aria-label="字變小">A－</button><output>${FSN[fsi]}</output><button type="button" data-fs="1" aria-label="字變大">A＋</button></div>`;
  h += it('fav', '★ 我的最愛', fav.filter(c => byC[c]).length) + it('recent', '🕘 最近複製', recent.filter(c => byC[c]).length);
  h += '<div class="sec">分類</div>' + it('all', '全部', D.rows.length);
  D.tabs.forEach(t => {
    if (!tabCount[t.id] && !t.flows.length) return;
    h += it(t.id, t.label, tabCount[t.id] || 0);
    if (state.tab === t.id) {
      const c = {}; D.rows.filter(r => r.t === t.id).forEach(r => c[r.s] = (c[r.s] || 0) + 1);
      h += '<div class="dsubs">' + t.subs.filter(s => c[s]).map(s => `<button class="chip" type="button" data-dsub="${esc(s)}" aria-pressed="${state.sub === s}">${esc(s)}<b>${c[s]}</b></button>`).join('') + '</div>';
    }
  });
  h += '<div class="sec">其他</div>' + it('flows', '常用流程', flowCount) + it('menus', '選單路徑', D.menus.length);
  $('#dbody').innerHTML = h;
}
function tabName(){
  if (state.q) return '搜尋「' + state.q + '」';
  const m = { all: '全部', fav: '★ 我的最愛', recent: '🕘 最近複製', flows: '常用流程', menus: '選單路徑' };
  if (m[state.tab]) return m[state.tab];
  const t = D.tabs.find(t => t.id === state.tab); return t.label + ' ▸ ' + (state.sub || '全部');
}
function renderHead(){
  $('#cur').textContent = '目前：' + tabName();
  const tab = D.tabs.find(t => t.id === state.tab);
  if (tab && !state.q) {
    const c = {}; D.rows.filter(r => r.t === tab.id).forEach(r => c[r.s] = (c[r.s] || 0) + 1);
    $('#subs').innerHTML = `<button class="chip" type="button" data-sub="" aria-pressed="${!state.sub}">全部</button>` + tab.subs.filter(s => c[s]).map(s => `<button class="chip" type="button" data-sub="${esc(s)}" aria-pressed="${state.sub === s}">${esc(s)}<b>${c[s]}</b></button>`).join('');
    $('#subs').hidden = false;
  } else $('#subs').hidden = true;
  const showQ = !state.q && state.tab === 'all';
  $('#quick').hidden = !showQ;
  if (showQ) $('#quick').innerHTML = QUICK.map(q => `<button type="button" data-q="${esc(q[1])}"><span>${q[2]}</span>${esc(q[0])}</button>`).join('');
}
function render(){
  renderHead();
  const ts = terms(); let list = '', blk = '', n = 0, desc = '';
  if (ts.length) {
    const collect = loose => { const items = D.rows.map((r,i) => ({i, sc: matchScore((r.c + ' ' + r.u + ' ' + r.s + ' ' + r.t.split('_')[1]).toLowerCase(), (r.e + ' ' + r.n + ' ' + r.k).toLowerCase(), ts, r.s.toLowerCase(), loose), r})).filter(x => x.sc >= 0);
      const fl = []; D.tabs.forEach(t => t.flows.forEach(f => { const sc = matchScore((f.name + ' ' + t.label).toLowerCase(), JSON.stringify(f.steps).toLowerCase(), ts, '', loose); if (sc >= 0) fl.push({sc, h: flowHTML(t, f)}); })); return [items, fl]; };
    desc = '在全部分類中搜尋';
    let [items, fl] = collect(false); if (!items.length && !fl.length) { [items, fl] = collect(true); if (items.length || fl.length) desc = '沒有完全符合的結果，以下是部分符合的'; }
    items.sort((x,y) => y.sc - x.sc || x.i - y.i); fl.sort((x,y) => y.sc - x.sc);
    list = items.map(x => row(x.r, ts)).join(''); blk = fl.length ? '<div class="subhd">相關流程</div>' + fl.map(x => x.h).join('') : '';
    n = items.length + fl.length;
    if (!n) list = `<div class="empty">找不到「${esc(state.q)}」<br>試試較短的關鍵字，或改用英文指令名稱</div>`;
  } else if (state.tab === 'flows') {
    D.tabs.forEach(t => t.flows.forEach(f => { blk += flowHTML(t, f); n++; })); desc = '照步驟做的操作流程';
  } else if (state.tab === 'menus') {
    D.menus.forEach(m => { blk += `<div class="menu"><span class="pill">${esc(m.tool)}</span><div class="p">${esc(m.path)}</div><div class="u">${esc(m.use)}</div></div>`; n++; }); desc = 'smitty / diag / ASMI 選單怎麼走';
  } else if (state.tab === 'fav' || state.tab === 'recent') {
    const arr = (state.tab === 'fav' ? fav : recent).map(c => byC[c]).filter(Boolean);
    list = arr.map(r => row(r, ts)).join(''); n = arr.length;
    desc = state.tab === 'fav' ? '點指令左邊的 ☆ 就會收到這裡（只存在這支手機）' : '最近按過「複製」的指令（最多 30 筆）';
    if (!n) list = `<div class="empty">${state.tab === 'fav' ? '還沒有最愛。在任何指令左邊點 ☆ 就會加進來。' : '還沒有複製過指令。'}</div>`;
  } else {
    const tab = D.tabs.find(t => t.id === state.tab);
    const rows = tab ? D.rows.filter(r => r.t === tab.id && (!state.sub || r.s === state.sub)) : D.rows;
    desc = tab ? tab.desc : '點左上角 ☰ 選分類，或直接搜尋中文、英文關鍵字；點一列可看範例與注意事項';
    list = rows.map(r => row(r, ts)).join(''); n = rows.length;
    if (tab && !state.sub && tab.flows.length) blk = '<div class="subhd">常用流程</div>' + tab.flows.map(f => flowHTML(tab, f)).join('');
  }
  $('#list').innerHTML = list; $('#blk').innerHTML = blk;
  $('#count').textContent = n + ' 筆'; $('#desc').textContent = desc; $('#clear').hidden = !state.q;
  if (document.body.classList.contains('menu-open')) renderDrawer();
}
function setTab(id){ state.tab = id; state.sub = null; state.q = ''; $('#q').value = ''; sv('aix_tab', id); }
function menu(on){ document.body.classList.toggle('menu-open', on); $('#hb').setAttribute('aria-expanded', on); if (on) renderDrawer(); }
$('#hb').addEventListener('click', () => menu(true));
$('#dx').addEventListener('click', () => menu(false));
$('#ov').addEventListener('click', () => menu(false));
addEventListener('keydown', e => { if (e.key === 'Escape') menu(false); });
$('#dbody').addEventListener('click', e => {
  const f = e.target.closest('[data-fs]'); if (f) { fsi = Math.max(0, Math.min(FS.length - 1, fsi + (+f.dataset.fs))); sv('aix_fs', fsi); applyFs(); renderDrawer(); return; }
  const s = e.target.closest('[data-dsub]'); if (s) { state.sub = state.sub === s.dataset.dsub ? null : s.dataset.dsub; render(); menu(false); scrollTo(0, 0); return; }
  const t = e.target.closest('[data-tab]'); if (!t) return;
  const id = t.dataset.tab; const hasSubs = D.tabs.some(x => x.id === id);
  setTab(id); render();
  if (hasSubs) renderDrawer(); else menu(false);
  scrollTo(0, 0);
});
$('#subs').addEventListener('click', e => { const b = e.target.closest('[data-sub]'); if (!b) return; state.sub = b.dataset.sub || null; render(); scrollTo(0, 0); });
$('#quick').addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; state.q = b.dataset.q; $('#q').value = state.q; render(); scrollTo(0, 0); });
let tm; $('#q').addEventListener('input', e => { clearTimeout(tm); tm = setTimeout(() => { state.q = e.target.value.trim(); render(); }, 120); });
$('#clear').addEventListener('click', () => { $('#q').value = ''; state.q = ''; render(); $('#q').focus(); });
$('#list').addEventListener('click', e => {
  const st = e.target.closest('.st');
  if (st) { const c = st.dataset.fav; fav = fav.includes(c) ? fav.filter(x => x !== c) : [c, ...fav]; sv('aix_fav', fav); render(); return; }
  const b = e.target.closest('.copy');
  if (b) {
    const c = b.dataset.c; recent = [c, ...recent.filter(x => x !== c)].slice(0, 30); sv('aix_recent', recent);
    const done = () => { b.textContent = '已複製'; b.classList.add('ok'); setTimeout(() => { b.textContent = '複製'; b.classList.remove('ok'); }, 1500); };
    const fallback = () => { const r = document.createRange(); r.selectNodeContents(b.parentNode.querySelector('code')); const s = getSelection(); s.removeAllRanges(); s.addRange(r); b.textContent = '已選取'; };
    try { navigator.clipboard.writeText(c).then(done, fallback); } catch (err) { fallback(); }
    return;
  }
  if (e.target.closest('.more') && getSelection().toString()) return;
  const r = e.target.closest('.r'); if (!r) return;
  const id = r.dataset.id; openSet.has(id) ? openSet.delete(id) : openSet.add(id); render();
});
$('#ver').textContent = '更新 ' + D.ver;
$('#foot').textContent = `共 ${D.rows.length} 個指令 · 橘色字代表要換成實際值`;
render();
</script>

const VER = "20261013-153155";
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function unlock(pw){
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
  const key = await crypto.subtle.deriveKey({name:'PBKDF2', salt:b64(P.s), iterations:P.n, hash:'SHA-256'}, base, {name:'AES-GCM', length:256}, false, ['decrypt']);
  const buf = await crypto.subtle.decrypt({name:'AES-GCM', iv:b64(P.i)}, key, b64(P.c));
  return JSON.parse(new TextDecoder().decode(buf));
}
function store(k, v){ try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch (e) {} }
function load(k){ try { return localStorage.getItem(k); } catch (e) { return null; } }
function open(data){
  window.__AIXDATA = data;
  document.getElementById('lock').hidden = true;
  document.getElementById('app').hidden = false;
  const s = document.createElement('script'); s.textContent = document.getElementById('appsrc').textContent; document.body.appendChild(s);
  const v = document.getElementById('ver');
  const net = document.createElement('span'); net.className = 'net';
  const upd = () => { net.textContent = navigator.onLine ? '連線中' : '離線'; net.classList.toggle('off', !navigator.onLine); };
  upd(); addEventListener('online', upd); addEventListener('offline', upd); v.after(net);
  const f = document.getElementById('foot');
  const lb = document.createElement('button'); lb.className = 'lockbtn'; lb.type = 'button'; lb.textContent = '登出（清除此手機記住的密碼）';
  lb.onclick = () => { store('aix_pw', null); location.reload(); };
  f.append(document.createElement('br'), 'App 版本 ' + VER + '　', lb);
  checkUpdate();
}
async function checkUpdate(){
  if (!navigator.onLine) return;
  try {
    const t = await (await fetch('./index.html?check=' + Date.now(), {cache:'no-store'})).text();
    const m = t.match(/const VER = "([^"]+)"/);
    if (m && m[1] !== VER) {
      const b = document.createElement('button'); b.className = 'upd'; b.type = 'button';
      b.textContent = '有新版本 ' + m[1] + '，點這裡更新';
      b.onclick = async () => { try { const r = await navigator.serviceWorker.getRegistration(); if (r) await r.update(); } catch (e) {} location.reload(); };
      document.body.appendChild(b);
    }
  } catch (e) {}
}
document.getElementById('lkf').addEventListener('submit', async e => {
  e.preventDefault();
  const pw = document.getElementById('pw').value, err = document.getElementById('err'), go = document.getElementById('go');
  if (!pw) { err.textContent = '請輸入密碼'; return; }
  go.disabled = true; go.textContent = '開啟中…'; err.textContent = '';
  try { const d = await unlock(pw); store('aix_pw', document.getElementById('rem').checked ? pw : null); open(d); }
  catch (x) { err.textContent = '密碼不正確，請再試一次'; go.disabled = false; go.textContent = '開啟'; }
});
(async () => {
  const saved = load('aix_pw');
  if (saved) { try { open(await unlock(saved)); } catch (e) { store('aix_pw', null); } }
})();
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
